name: Adicionar projeto Caminho Leve

on:
  push:
    paths:
      - '.github/workflows/add-caminho-leve.yml'

permissions:
  contents: write

jobs:
  atualizar-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Adicionar imagem e seção do projeto
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          b64 = (
          ""
          +
          ""
          )

          assets = Path("assets")
          assets.mkdir(exist_ok=True)
          (assets / "caminho-leve-tai-chi.webp").write_bytes(base64.b64decode(b64))

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")

          marker = 'id="projeto-caminho-leve"'
          if marker not in html:
              section = '''
          <section id="projeto-caminho-leve" style="padding:82px 0;background:linear-gradient(180deg,#11161a,#172019);border-top:1px solid #2c313d;border-bottom:1px solid #2c313d;">
            <div class="wrap" style="display:grid;grid-template-columns:minmax(280px,.9fr) minmax(300px,1.1fr);gap:32px;align-items:center;">
              <div>
                <img src="assets/caminho-leve-tai-chi.webp" alt="Projeto Caminho Leve, aulas de Tai Chi Chuan no Horto Municipal de Três Rios/RJ" style="width:100%;max-width:520px;margin:auto;border-radius:22px;display:block;box-shadow:0 24px 60px rgba(0,0,0,.35);">
              </div>
              <div>
                <span class="eyebrow">Projeto de Tai Chi Chuan</span>
                <h2>Caminho Leve</h2>
                <p style="color:var(--muted);font-size:18px;">Aulas de Tai Chi Chuan no Horto Municipal de Três Rios/RJ, unindo movimento, natureza e bem-estar.</p>
                <p style="color:var(--muted);">Uma prática ao ar livre voltada ao equilíbrio, mobilidade, respiração, consciência corporal e qualidade de vida.</p>
                <a class="btn btn-primary" href="https://calendar.app.google/pgZaaSRxXKSPLkT68" target="_blank" rel="noopener">Agendar uma aula</a>
              </div>
            </div>
            <style>
              @media(max-width:800px){
                #projeto-caminho-leve .wrap{grid-template-columns:1fr !important;}
              }
            </style>
          </section>
          '''
              anchor = '<section id="sobre">'
              if anchor in html:
                  html = html.replace(anchor, section + '\n' + anchor, 1)
              else:
                  html = html.replace('</main>', section + '\n</main>', 1)
              index.write_text(html, encoding="utf-8")
          PY

      - name: Salvar atualização
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/caminho-leve-tai-chi.webp
          git diff --cached --quiet && exit 0
          git commit -m "Adicionar projeto Caminho Leve ao site"
          git push
