name: Adicionar seção Sanda

on:
  push:
    paths:
      - '.github/workflows/add-sanda-section.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inserir seção informativa sobre Sanda
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          html = p.read_text(encoding="utf-8")

          if 'id="historia-sanda"' in html:
              raise SystemExit(0)

          section = r'''
          <section id="historia-sanda" class="project">
            <div class="wrap">
              <div class="section-head">
                <span class="eyebrow">Conheça a modalidade</span>
                <h2>O que é Sanda, Boxe Chinês ou Sanshou?</h2>
                <p>O Sanda é a modalidade de combate do Wushu moderno. Ele reúne técnicas de socos, chutes, projeções, quedas, defesas e movimentação, formando um sistema de luta dinâmico e completo.</p>
              </div>

              <div class="split">
                <div class="feature">
                  <span class="tag">Sanda / Sanshou</span>
                  <h3>Combate completo em pé</h3>
                  <p>No Brasil, a modalidade também ficou conhecida como <strong>Boxe Chinês</strong>. O termo <strong>Sanshou</strong> aparece tradicionalmente ligado à ideia de combate livre, enquanto <strong>Sanda</strong> é o nome mais usado hoje nas competições oficiais de Wushu.</p>
                  <p>O treinamento trabalha golpes de mãos e pernas, deslocamentos, defesas, entradas de queda e projeções, além de condicionamento físico, estratégia e controle emocional.</p>
                </div>

                <div class="feature">
                  <span class="tag">Um pouco da história</span>
                  <h3>Das tradições chinesas ao esporte moderno</h3>
                  <p>As raízes do Sanda estão ligadas aos métodos tradicionais de combate chineses e às antigas disputas realizadas em plataformas conhecidas como <strong>Leitai</strong>.</p>
                  <p>Ao longo do século XX, especialmente entre as décadas de 1970 e 1980, esses métodos começaram a ser organizados de forma mais sistemática para treinamento e competição. Com a criação da Federação Internacional de Wushu em 1990, o Sanda se consolidou como uma das principais modalidades competitivas do Wushu moderno.</p>
                </div>
              </div>

              <div class="feature" style="margin-top:22px;">
                <span class="tag">O que você aprende</span>
                <div class="info-strip">
                  <div class="info-chip"><strong>Golpes e combinações</strong><span>Socos, chutes, defesas e contra-ataques</span></div>
                  <div class="info-chip"><strong>Projeções e quedas</strong><span>Entradas, desequilíbrios e controle da distância</span></div>
                  <div class="info-chip"><strong>Estratégia de combate</strong><span>Tempo, movimentação, resistência e tomada de decisão</span></div>
                </div>
              </div>

              <div class="booking" style="margin-top:24px;">
                <div>
                  <span class="eyebrow" style="color:#fff">Boxe Chinês na Axios</span>
                  <h2>Sanda é mais do que trocar golpes.</h2>
                  <p>É aprender a controlar distância, tempo, equilíbrio e decisão sob pressão.</p>
                </div>
                <a class="btn" href="https://calendar.app.google/pgZaaSRxXKSPLkT68" target="_blank" rel="noopener">Agendar uma aula</a>
              </div>
            </div>
          </section>
          '''

          anchor = '<section id="formatos">'
          if anchor in html:
              html = html.replace(anchor, section + '\n' + anchor, 1)
          else:
              html = html.replace('</main>', section + '\n</main>', 1)

          p.write_text(html, encoding="utf-8")
          PY

      - name: Salvar atualização
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Adicionar seção sobre Sanda Boxe Chinês e Sanshou"
          git push
