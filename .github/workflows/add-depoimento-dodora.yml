name: Adicionar depoimento Dodora Andrade

on:
  push:
    paths:
      - '.github/workflows/add-depoimento-dodora.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inserir depoimento no site
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          p = Path("index.html")
          html = p.read_text(encoding="utf-8")

          if "@andradedodora" in html:
              raise SystemExit(0)

          target = base64.b64decode("").decode("utf-8")
          new = base64.b64decode("").decode("utf-8")

          if target in html:
              html = html.replace(target, new, 1)
          else:
              marker = '<div class="grid cards-3">'
              section_pos = html.find('id="depoimentos"')
              grid_pos = html.find(marker, section_pos)
              if section_pos < 0 or grid_pos < 0:
                  raise SystemExit("Secao de depoimentos nao encontrada")
              insert_pos = grid_pos + len(marker)
              html = html[:insert_pos] + "\n" + new + html[insert_pos:]

          p.write_text(html, encoding="utf-8")
          PY

      - name: Salvar alteracao
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Adicionar depoimento de Dodora Andrade"
          git push
